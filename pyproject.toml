[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlab"
version = "0.1.0"
description = "Credit and capital-structure research platform: structural and reduced-form credit models, bankruptcy waterfalls, relative-value analytics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
research = ["pandas>=2.1", "matplotlib>=3.8", "requests>=2.31", "pypdf>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

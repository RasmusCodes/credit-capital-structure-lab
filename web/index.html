<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit and capital-structure lab</title>
<style>
  :root { --bg: #fbfaf6; --surface: #ffffff; --surface-2: #f3f1ea; --ink: #1a1a18; --ink-2: #2f2e2a; --muted: #6b6963; --faint: #8f8c84;
    --rule: #e6e2d8; --rule-strong: #d3cec1; --accent: #14594b; --accent-ink: #f6f3ea; --accent-soft: #e3efea;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121413; --surface: #181b19; --surface-2: #1f2321; --ink: #ecebe5;
    --ink-2: #d8d6ce; --muted: #a19e95; --faint: #7c7970; --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-ink: #0b1f1a; --accent-soft: #163730; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #121413; --surface: #181b19; --surface-2: #1f2321; --ink: #ecebe5; --ink-2: #d8d6ce; --muted: #a19e95;
    --faint: #7c7970; --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-ink: #0b1f1a; --accent-soft: #163730; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 0; }
  header h1 { font-size: 26px; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; max-width: 760px; }
</style>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header>
  <h1>Credit and capital-structure lab</h1>
  <p>Standalone copy of the interactive demo. The same files run on the project page of the website.</p>
</header>
<div id="credit-lab" class="clab"></div>
<script type="module" src="lab-app.js"></script>
</body>
</html>
